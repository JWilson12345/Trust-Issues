<body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas>
  <div id="ui">
    <div id="title" class="screen"></div><div id="zones" class="screen"></div><div id="levels" class="screen"></div>
    <div id="chars" class="screen"></div><div id="settings" class="screen"></div><div id="pause" class="screen"></div><div id="complete" class="screen"></div><div id="tip" class="screen"></div><div id="hc" class="screen"></div><div id="stats" class="screen"></div><div id="ach" class="screen"></div><div id="help" class="screen"></div><div id="diff" class="screen"></div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
    <div id="toasts"></div>
  </div>
</div></div>
<div class="tc" id="tcl"><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div>
<div class="tc" id="tcr"><div class="tbs" id="abBtns"><div class="tb sm" data-k="strike">🧂</div><div class="tb sm" data-k="dash">💨</div><div class="tb sm" data-k="echo">⟲</div></div><div class="tb" data-k="jump">▲</div></div>
<script>

/* ---- boss.js ---- */
/* ===================== BOSSES + ABILITIES (deterministic) ===================== */
const BOSS_INFO = {
  gate: { name: 'The Molten Gatekeeper', w: 64, h: 64, hp: 8, reward: 'dj', how: [['🔥', 'Jump over his <b>fire waves</b> when he slams the ground.'], ['💫', 'After a slam he is <b>DAZED</b> for a moment.'], ['⬇️', '<b>JUMP ON HIS HEAD</b> while he is dazed to hurt him.']] },
  devil: { name: 'The Devil', w: 60, h: 60, hp: 8, reward: 'dash', how: [['☄️', 'Keep moving to dodge his <b>fireballs</b> and dive attacks.'], ['😮‍💨', 'After a while he gets <b>TIRED</b> and sinks low.'], ['⬇️', '<b>DOUBLE-JUMP</b> onto his head while he is tired.']] },
  tyrant: { name: 'The Neon Tyrant', w: 110, h: 140, hp: 8, reward: 'spite', how: [['⚡', 'Jump the <b>low lasers</b>, stay on the ground for the high ones.'], ['🔥', 'When his core glows yellow he <b>OVERHEATS</b>.'], ['💨', '<b>DASH</b> over the electric floor and <b>LAND ON HIS HEAD</b>.']] },
  king: { name: 'The Pixel King', w: 70, h: 70, hp: 10, reward: 'strike', how: [['🛡️', 'His <b>ARMOUR</b> bounces you off. Stomping does nothing yet.'], ['💨', '<b>DASH INTO HIM</b> to smash the armour off. Not while it is <b>spiked</b>!'], ['⬇️', 'He is <b>DIZZY</b> for a moment. <b>JUMP ON HIS HEAD!</b>']] },
};
const ABILITIES = {
  dj: { name: 'Double Jump', icon: '⏫', desc: 'Press jump again in mid-air for a second jump.' },
  dash: { name: 'Dash', icon: '💨', desc: 'Press SHIFT (or X) to burst forward — works in the air too.' },
  spite: { name: 'Spite', icon: '😤', desc: 'Too angry to die: the first fatal hit in a boss fight revives you.' },
  strike: { name: 'Salt Strike', icon: '🧂', desc: 'Press Q once per boss fight to call down a salt meteor for a critical hit.' },
};
function makeBoss(cfg, hpMul = 1) {
  const I = BOSS_INFO[cfg.type], hp0 = Math.max(2, Math.round((cfg.hp || I.hp) * hpMul));
  const floor = (cfg.floor || 12) * TS;
  return { type: cfg.type, name: I.name, w: I.w, h: I.h, hp: hp0, max: hp0, x: cfg.x * TS, y: cfg.y != null ? cfg.y * TS : floor - I.h,
    floor, vx: 0, vy: 0, st: 'intro', t: 0, inv: 0, vul: 0, harm: 1, armor: cfg.type === 'king' ? 1 : 0, cnt: 0, face: -1, dead: 0, warn: null };
}
function spawnProj(S, o) {
  const e = Object.assign({ k: 'saw', vis: 1, act: 1, sol: 0, vy: 0, dx: 0, dy: 0, w: 0, h: 0, r: 12, proj: 1, life: 400, pvx: 0, pvy: 0, pg: 0 }, o);
  S.ents.push(e); e.i = S.ents.length - 1; return e;
}
function bossPhase(B) { const f = B.hp / B.max; return f > 0.67 ? 1 : f > 0.34 ? 2 : 3; }
function setSt(B, st) { B.st = st; B.t = 0; }
function updProj(S) {
  let any = false;
  for (const e of S.ents) {
    if (!e.proj || e.dead) continue;
