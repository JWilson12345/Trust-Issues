<script>

/* ---- boss.js ---- */
/* ===================== BOSSES + ABILITIES (deterministic) ===================== */
const BOSS_INFO = {
  gate: { name: 'The Molten Gatekeeper', w: 64, h: 64, hp: 6, reward: 'dj', how: [['♨️', 'He is too hot to touch. Lead him over a <b>bubbling geyser</b> as it erupts.'], ['🪨', 'The steam turns him to <b>ROCK</b> for a few seconds.'], ['⬇️', '<b>STOMP THE ROCK!</b> Geysers also launch YOU into the air.']] },
  devil: { name: 'The Devil', w: 60, h: 60, hp: 6, reward: 'dash', how: [['🔱', 'He throws <b>pitchforks</b> that stick in the walls.'], ['🧗', 'The forks are <b>platforms</b>. Climb them up the wall.'], ['⬇️', 'From the top fork, <b>jump onto him</b> as he flies past.']] },
  tyrant: { name: 'The Neon Tyrant', w: 110, h: 140, hp: 6, reward: 'spite', how: [['⚡', 'Jump the <b>low lasers</b>, stay down for the high ones. Double-jump his charge.'], ['🔋', 'When he vents, one <b>POWER CORE</b> opens: knee, chest, then head.'], ['💨', '<b>DASH INTO THE OPEN CORE</b> from close up. Knee: dash on the ground. Chest: small hop. Head: full jump, dash at the top.']] },
  mirror: { name: 'The Mirror Knight', w: 50, h: 72, hp: 6, how: [['🪞', 'He <b>copies</b> you from the other side of the hall.'], ['⬇️', 'Stand on a <b>PLATE</b>: the crusher on <b>HIS</b> side drops on him.'], ['🏃', 'Last phase he <b>CHASES</b> you instead — lure him under your own crusher.']] },
  wyrm: { name: 'The Storm Wyrm', w: 96, h: 56, hp: 6, how: [['🐉', 'His tail <b>swoops low</b>. Jump onto it and <b>ride him</b>.'], ['🏃', 'Run up his back. <b>STOMP HIS HEAD</b> from above.'], ['⚡', 'Dodge lightning and wind. Late on, he <b>ROLLS</b> — jump when he shimmers.']] },
  puppet: { name: 'The Puppeteer', w: 76, h: 76, hp: 6, how: [['🔄', 'Step on a <b>gravity pad</b> to walk on the ceiling.'], ['✂️', 'Touch the <b>ANCHORS</b> on the ceiling to cut his strings.'], ['🎎', 'His puppets and grabs follow you to <b>either surface</b>.']] },
  choir: { name: 'The Hollow Choir', w: 60, h: 60, hp: 6, how: [['👂', 'The masks <b>sing a melody</b> — watch which bells light up.'], ['🔔', '<b>Jump into the bells</b> in the same order.'], ['🎵', 'Dodge the sound waves. Wrong bell = shockwave. Songs get longer.']] },
  overlord: { name: 'THE OVERLORD', w: 120, h: 110, hp: 9, how: [['💨', 'Phase 1: <b>DASH INTO HIS FIREBALLS</b> to send them back at him.'], ['🔷', 'Phase 2: he is shielded. <b>DASH into his PYLONS</b> to smash them.'], ['⬇️', 'Phase 3: when he sinks, <b>DASH</b> to crack his mask, then <b>stomp</b>.']] },
  king: { name: 'The Pixel King', w: 70, h: 70, hp: 6, reward: 'strike', how: [['🏐', 'Bump the <b>ball</b> into the bricks under his throne. Smash the middle ones and he <b>crashes down</b>: stomp him or dash into him.'], ['🔨', 'He leaps at you with his <b>HAMMER</b>. When it gets stuck in the floor, <b>DASH</b> into him and crack it.'], ['💢', 'Hammer broken, he goes <b>berserk</b>. Jump his charge so he hits the wall, dodge his pounce. When he is <b>DAZED</b>, finish him.']] },
};
const ABILITIES = {
  dj: { name: 'Double Jump', icon: '⏫', desc: 'Press jump again in mid-air for a second jump.' },
  dash: { name: 'Dash', icon: '💨', desc: 'Press SHIFT (or X) to burst forward — works in the air too.' },
  spite: { name: 'Spite', icon: '😤', desc: 'Too angry to die: the first fatal hit in a boss fight revives you.' },
  strike: { name: 'Salt Strike', icon: '🧂', desc: 'Press Q once per boss fight to call down a salt meteor for a critical hit.' },
};
function makeBoss(cfg, hpMul = 1) {
  const I = BOSS_INFO[cfg.type], hp0 = Math.max(2, Math.round((cfg.hp || I.hp) * hpMul));
  const floor = (cfg.floor || 12) * TS;
  return { type: cfg.type, name: I.name, w: I.w, h: I.h, hp: hp0, max: hp0, x: cfg.x * TS, y: cfg.y != null ? cfg.y * TS : floor - I.h,
    floor, vx: 0, vy: 0, st: 'intro', t: 0, inv: 0, vul: 0, harm: 1, armor: 0, g: 0, cnt: 0, face: -1, dead: 0, warn: null };

function spawnProj(S, o) {

}
function bossPhase(B) { const f = B.hp / B.max; return f > 0.67 ? 1 : f > 0.34 ? 2 : 3; }
function setSt(B, st) { B.st = st; B.t = 0; }
function updProj(S) {

    e.x += e.pvx; e.y += e.pvy; e.pvy += e.pg; e.dx = e.pvx; e.dy = e.pvy;
    if (--e.life <= 0 || e.x < -80 || e.x > GW + 80 || e.y > GH + 80 || e.y < -200) { e.dead = 1; e.vis = 0; }

function updBoss(S) {

/* ---------- Part II bosses ---------- */
const clampX = (B, m = 8) => { B.x = Math.max(m, Math.min(GW - B.w - m, B.x)); };

const floorWave = (S, x, dir, sp, kind) => spawnProj(S, { k: 'lv', x: dir < 0 ? x - 30 : x, y: S.boss.floor - 22, w: 28, h: 22, pvx: dir * sp, wave: 1, [kind || 'wave2']: 1 });
function tickBolts(S, B, shake) { // copy-on-write so cloned states (solver) never share bolt timers
  if (!B.bolts || !B.bolts.length) { B.bolts = []; return; }

  for (const b of B.bolts) if (b.t === 0) { spawnProj(S, { k: 'lv', x: b.x - 16, y: -20, w: 32, h: B.floor + 20, life: 20, beam: 1, bolt: 1 }); ev(S, 'laser'); if (shake) ev(S, 'shake', 5); }

}

    for (const e of S.ents) if (e.proj) { e.dead = 1; e.vis = 0; }

/* power-ups: deterministic spawns that only ever help the player */
const PUPS = { shield: { icon: '🛡️', name: 'SAFETY NET', col: '#7ec8ff' }, power: { icon: '⚡', name: 'POWER STOMP', col: '#ffd23f' }, slow: { icon: '⏳', name: 'SLOW TIME', col: '#c58bff' } };

    u.got = 1; if (u.k === 'shield') S.guard = Math.min(3, (S.guard || 0) + 1); else if (u.k === 'power') S.powT = 900; else S.slowT = 300;

}
function bossContact(S) {
  const B = S.boss; if (!B || B.dead) return;

  const feet = { x: p.x + 1, y: p.y + p.h - 6, w: p.w - 2, h: 10 };
  const top = { x: B.x + 2, y: B.y - 6, w: B.w - 4, h: 20 };
  const hb = { x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 6 };
  if (B.guard > 0 && p.dashT > 0 && ov(hb, { x: B.x - 4, y: B.y, w: B.w + 8, h: B.h })) { // spiked armour: dashing just bounces you off
    p.dashT = 0; p.vx = -p.face * 7; p.vy = -7 * g; ev(S, 'bonk'); ev(S, 'spiked'); return;
  }
  if (p.dashT > 0 && B.armor && ov(hb, { x: B.x - 4, y: B.y, w: B.w + 8, h: B.h })) {
    B.armor = 0; setSt(B, 'stun'); B.vy = 0; p.dashT = 0; p.vx = -p.face * 6; p.vy = -6 * g; ev(S, 'armor', B.x + B.w / 2, B.y); ev(S, 'shake', 8); return;
  }

    if (B.vul && !B.inv) { const pw = S.powT > 0; if (pw) S.powT = 0; hitBoss(S, pw ? 2 : 1, pw); p.vy = -10 * g; p.djU = 0; p.invT = Math.max(p.invT || 0, 40); return; }
    p.vy = -9 * g; p.djU = 0; ev(S, 'bonk'); return; // landing on his head when he is not open just bounces you off
  }

  const B = S.boss; if (!B || B.dead || S.strikeUsed || !S.ab.strike) return;
  S.strikeUsed = 1; S.met = { x: B.x + B.w / 2, y: -80, t: 0 }; ev(S, 'strike');
}
function updStrike(S) {
  const m = S.met; if (!m) return;
  const B = S.boss; m.t++;
  if (B && !B.dead) { m.x += (B.x + B.w / 2 - m.x) * 0.2; m.y += 16; if (m.y >= B.y) { S.met = null; hitBoss(S, 2, 1); ev(S, 'shake', 18); ev(S, 'slam', m.x, B.floor, 1.3); } }

/* ---- bossai.js ---- */
/* ===================== BOSS AI — nine bosses, nine different ideas =====================
   Every boss has its own way to be hurt (its "core idea"). All state is plain numbers or
   copy-on-write so cloned states (the solver) never share mutable data.
   B.tip/B.tipK  -> the on-screen prompt.  B.goal -> where a solver should head.  B.pk -> extra state key. */
const hitP = (S, n = 1) => { const pw = S.powT > 0; if (pw) S.powT = 0; hitBoss(S, n * (pw ? 2 : 1), pw); };

const pHB = p => ({ x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 6 });
const circHit = (cx, cy, r, b) => { const nx = Math.max(b.x, Math.min(cx, b.x + b.w)), ny = Math.max(b.y, Math.min(cy, b.y + b.h)); return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r; };

const onSurf = (S, p) => p.on;
const GEYX = [240, 720];
const MIRX = [140, 820];
const ROD = null;
const PUPPAD = { floor: [140, 820], ceil: [60, 900] };
const ANCH = [null, [330, 630], [200, 760], [480, 860]];
const BELLX = [210, 480, 750];
const PYL = [[100, 320], [480, 360], [860, 320]];

function wyrmPt(u, k) { const v = u - k * 14; return [480 + 390 * Math.sin(v * 0.0075), 165 + 60 * Math.sin(v * 0.015 + 1.3) + k * 17]; }
function laser(S, B, hi, x2) { const hy = hi ? B.floor - 74 : B.floor - 17; const rt = (S.dm ? S.dm.bossRate : 1) * (S.slowT > 0 ? 0.5 : 1); spawnProj(S, { k: 'lv', x: 0, y: hy, w: x2 == null ? GW : x2, h: hi ? 18 : 13, life: Math.max(6, Math.round(16 * rt)), beam: 1 }); /* a beam lasts ~16 real frames whatever the boss speed */ ev(S, 'laser'); }

const BOSSAI = {
  /* 1 · MOLTEN GATEKEEPER — lure him over an erupting geyser: he hardens into rock, THEN stomp him */

  /* 2 · THE DEVIL — he hovers out of reach. His pitchforks stick in the walls: climb them and stomp him in the air */

/* ---------- points economy ---------- */
const PTS = {
  icon: '💠',
  fmt: n => Math.round(n).toLocaleString(),
  owned: id => (SV.owned || []).includes(id),
  add(n, why) { n = Math.max(0, Math.round(n)); if (!n) return 0; SV.pts = (SV.pts || 0) + n; SV.ptsAll = (SV.ptsAll || 0) + n; return n; },
  /* first clear: score/5. replay: 20% of score/5 plus the full value of any improvement */
  level(prevBest, score, firstBoss) {
    let n = prevBest == null ? score / 5 : score / 25 + Math.max(0, score - prevBest) / 5;
    if (firstBoss) n += 500;
    return PTS.add(n);
  },
  cheapest() { return SHOP.filter(c => !PTS.owned(c.id)).reduce((m, c) => Math.min(m, c.price), Infinity); },
  canAfford() { return SHOP.filter(c => !PTS.owned(c.id) && c.price <= (SV.pts || 0)).length; },
  init() {
    if (SV.ptsInit) return; SV.owned = SV.owned || []; SV.pts = SV.pts || 0;
    let s = 0; for (const k in SV.lv) s += (SV.lv[k].b || 0) / 5;
    s += Object.keys(SV.ach || {}).length * 100 + Object.keys((SV.st && SV.st.boss) || {}).length * 500;
    SV.ptsInit = 1; const got = PTS.add(s); save();
    if (got > 0) setTimeout(() => toast(`💠 <b>The Character Shop is open!</b> You've earned <b>${PTS.fmt(got)}</b> points from your past runs. Spend them in Characters → Shop.`), 1800);
  },
  buy(id) {
    const c = SHOP.find(q => q.id === id); if (!c || PTS.owned(id) || (SV.pts || 0) < c.price) return false;
    SV.pts -= c.price; SV.owned.push(id); if (SV.cu && !SV.cu.includes(id)) SV.cu.push(id); SV.char = id; save(); return true;
  },
};

}

  if (G.S.boss) G.introT = 999; // the boss intro replaces the level title card
  if (G.S.boss) { Music.play('boss_' + G.S.boss.type); if (Music.cur) { Music.cur.boost = 0; Music.rage(false); } }
  if (intro || !G.layer) G.layer = buildStaticLayer(G.S, THEMES[G.theme], G.theme);
  RAGE.reset();
  if (!G.S.boss) G.introT = intro ? 0 : 999; G.trail = []; G.sx = 1; G.sy = 1; G.glitchT = 0;
}

ACTIONS.restart = () => { hideScreens(); G.mode = 'play'; AU.setDuck(1); ST.restarts++; if (G.hc) { G.S.dead = 1; G.S.why = 'restart'; stepPlay(); return; } G.runDeaths++; SV.deaths++; save(); loadState(false); };
ACTIONS.tolevels = () => { endPlay(); showScreen('levels', `.card.lvl:nth-child(${G.l + 1})`); };
ACTIONS.title2 = () => { endPlay(); showScreen('title'); };
function showStory(z, l, force) {

ACTIONS.storygo = () => { const d = ZONES[G.z].levels[G.l]; hideScreens(); G.mode = 'play'; AU.setDuck(1); G.introT = 0; showTip(d); };

ACTIONS.tipgo = () => { hideScreens(); G.mode = 'play'; AU.setDuck(1); G.introT = 0; };
function endPlay() { G.hc = false; RAGE.reset(); document.body.classList.remove('ab-dash', 'ab-strike', 'ab-echo'); G.mode = 'menu'; AU.setDuck(1); document.body.classList.remove('playing'); G.parts = []; }

function handleEv(e) {
  const S = G.S, p = S.p, c = ch(); statEv(e); BFX.ev(e, S);
  switch (e[0]) {
    case 'jump': SFX.jump(c.pitch); G.sx = 0.7; G.sy = 1.35; burst(p.x + 11, S.f.g > 0 ? p.y + 26 : p.y, 5, 'rgba(255,255,255,.5)', 1.5, 0, 16, 4); break;
    case 'land': SFX.land(); G.sx = 1.3; G.sy = 0.72; burst(p.x + 11, S.f.g > 0 ? p.y + 26 : p.y, 6, 'rgba(255,255,255,.45)', 1.8, 0, 14, 4); break;
    case 'coin': SFX.coin(); burst(e[1], e[2], 14, ['#ffd23f', '#fff3b0'], 3, 0.05, 30, 4); break;
    case 'trap': SFX.trap(); break;
    case 'thud': SFX.thud(); G.shake = Math.max(G.shake, 7); burst(e[1], e[2], 10, THEMES[G.theme].solid, 3, 0.2, 30, 5); break;
    case 'crumble': SFX.crumble(); burst(e[1], e[2] + 8, 10, THEMES[G.theme].solid, 2, 0.25, 40, 6); break;
    case 'spring': SFX.spring(); G.sx = 0.6; G.sy = 1.5; break;
    case 'flip': SFX.flip(); G.flashT = 8; break;
    case 'portal': SFX.portal(); burst(e[1], e[2], 18, ['#4fd1ff', '#ff4fd8', '#fff'], 4, 0, 26, 4); break;
    case 'bonk': SFX.bonk(); if (S.boss && S.boss.armor && !S.boss.guard && !S.boss.dead) floatText(p.x + 11, p.y - 10, 'ARMOURED! 💨 DASH INTO HIM FIRST', '#ff8a8a'); else if (S.boss && !S.boss.dead && !S.boss.armor && !S.boss.vul && !S.boss.inv) floatText(p.x + 11, p.y - 10, 'NOT YET! WAIT FOR THE OPENING', '#ff8a8a'); break;
    case 'reveal': SFX.reveal(); break;
    case 'glitch': SFX.glitch(); G.glitchT = 14; break;
    case 'wind': SFX.wind(); break;
    case 'say': SFX.say(); break;
    case 'spite': RAGE.cfg = { shake: SV.shake, calm: SV.calm, vibe: SV.vibe }; RAGE.start(S, e[1], e[2], c, G.theme); SV.spites = (SV.spites || 0) + 1; break;
    case 'bosshit': SFX.bossHit(); burst(e[1], e[2], 20, ['#ffd23f', '#fff', '#ff5a1f'], 7, 0.25, 40, 6); break;
    case 'armor': SFX.armor(); burst(e[1], e[2] + 20, 26, ['#c0c7d1', '#ffffff', '#7ec8ff'], 7, 0.35, 50, 6); floatText(e[1], e[2] - 24, 'ARMOUR SMASHED! STOMP HIM!', '#7ec8ff'); break;
    case 'bossdown': break;
    case 'dash': SFX.dash(); burst(e[1], e[2], 10, 'rgba(255,255,255,.6)', 3, 0, 18, 4); break;
    case 'djump': SFX.jump(c.pitch * 1.3); burst(e[1], e[2] + 12, 10, 'rgba(255,255,255,.6)', 3, 0.1, 18, 4); break;
    case 'boing': SFX.boing(); break;
    case 'shield': SFX.shield(); G.shake = Math.max(G.shake, 8); burst(e[1], e[2], 34, ['#ffffff', '#cfe9ff', '#7ec8ff'], 6, 0.12, 40, 5); floatText(e[1], e[2] - 30, 'SAVED BY THE SAFETY NET!', '#cfe9ff'); break;
    case 'spiked': floatText(p.x + 11, p.y - 10, 'SPIKED! WAIT FOR THEM TO DROP', '#ff8a8a'); break;
    case 'shoot': SFX.shoot(); break;
    case 'laser': SFX.laser(); break;
    case 'shake': G.shake = Math.max(G.shake, e[1] || 8); if (G.theme === 'haunted' || G.theme === 'sky') BG.flash = 14; break;
  }
}
function stepPlay() {
  const S = G.S;
  step(S, { l: keys.left, r: keys.right, j: keys.jump, jp: jumpPressed, dash: press.dash, strike: press.strike, echo: press.echo });
  jumpPressed = false; press.dash = press.strike = press.echo = 0; statFrame(S);
  for (const e of S.ev) handleEv(e);
  const c = ch();
  if (c.trail && G.T % 3 === 0) { G.trail.push({ x: S.p.x, y: S.p.y, f: S.p.face, g: S.f.g, life: 14 }); }
  G.trail.forEach(t => t.life--); G.trail = G.trail.filter(t => t.life > 0);
  if (S.dead) {
    G.mode = 'dying'; G.deadT = 0; G.runDeaths++; SV.deaths++; ST.dby[S.why || 'trap'] = (ST.dby[S.why || 'trap'] || 0) + 1;
    G.hcOver = G.hc ? hcLoseLife() : false; save();
    if (S.boss && !S.boss.dead && S.why !== 'restart') { PDX.start(S, c); G.VT = G.T; G.vacc = 0; }
    else { SFX.die(); if (SV.shake) G.shake = 14; burst(S.p.x + 11, S.p.y + 13, 34, [c.body, c.body, '#ffffff'], 7, 0.32 * S.f.g, 60, 6); }

  } else if (S.won) {
    G.mode = 'won'; G.winT = 0; SFX.win();

    burst(d.x + d.w / 2, d.y + d.h / 2, 40, [THEMES[G.theme].doorIn, '#fff', '#ffd23f'], 6, 0.1, 50, 5);
  }
}
function unlockToast(list) { list.forEach((c, i) => setTimeout(() => { SFX.unlock(); toast(`🔓 New character unlocked: <b>${c.name}</b>!`); }, 400 + i * 700)); }

function finishLevel() {

  if (def.boss) { ST.bossD = ST.bossD || {}; ST.bossD[def.boss.type] = Math.max(ST.bossD[def.boss.type] != null ? ST.bossD[def.boss.type] : -1, di); if (di >= 3) reward += `<div class="reward" style="background:linear-gradient(135deg,#5a0012,#ff3b5c)">BETRAYED VICTORY<b>💀 Trust No One</b><span>Beaten on the hardest difficulty. Check your characters and achievements.</span></div>`; }
  if (def.boss) { const bt = def.boss.type; const first = !ST.boss[bt]; ST.boss[bt] = 1; if (deaths === 0) ST.bossClean++; if (def.reward) { SV.abil[def.reward] = 1; const A = ABILITIES[def.reward]; reward = `<div class="reward">${first ? 'NEW ABILITY UNLOCKED' : 'ABILITY'}<b>${A.icon} ${A.name}</b><span>${A.desc} It's yours in future boss fights.</span></div>`; } }

  if (def.boss && typeof BOSS_OUTRO !== 'undefined' && BOSS_OUTRO[def.boss.type] && def.boss.type !== 'king') reward += `<div class="note lore">📜 ${BOSS_OUTRO[def.boss.type]}</div>`;

  $('#complete').innerHTML = `<div class="panel mid wide ${reward || G.hc ? 'compact' : ''}">

    <div class="bigstars">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${0.25 + i * 0.3}s">★</span>`).join('')}</div>
    <div class="rows">
      <div><span>Time</span><b>${secs.toFixed(2)}s <small>(par ${par}s)</small></b><em>+${tb}</em></div>
      <div><span>Deaths</span><b>${deaths}</b><em>${deaths ? '−' + pen : '+500 flawless'}</em></div>

      <div><span>Difficulty</span><b style="color:${D.col}">${D.icon} ${D.lvl}</b><em>×${D.mult}</em></div>
    </div>

    ${reward}${G.hc ? `<div class="note">💀 Hardcore: ${hcDone ? '<b>YOU FINISHED THE WHOLE RUN. LEGEND.</b>' : `${SV.hc.cleared}/${HC_TOTAL} cleared · ${'❤️'.repeat(SV.hc.lives)}${'🖤'.repeat(3 - SV.hc.lives)}`}</div>` : ''}
    <div class="menu row">${def.boss && def.boss.type === 'overlord' && !G.hc ? btn('▶ THE END', 'big primary', 'ending') : ''}${G.hc ? (hcDone ? btn('⌂ Main menu', 'big primary', 'title2') : btn('Next ▶', 'big primary', 'hcnext') + btn('⌂ Save & quit', 'big', 'title2')) : (hasNext ? btn(last ? 'Next zone ▶' : 'Next ▶', 'big primary', 'next') : '') + btn('↻ Retry', 'big', 'retry') + btn('☰ Levels', 'big', 'tolevels2')}</div></div>`;

ACTIONS.next = () => { const zone = ZONES[G.z]; if (G.l < zone.levels.length - 1) startLevel(G.z, G.l + 1); else if (G.z + 1 < ZONES.length && !ZONES[G.z + 1].bonus) ZTR.start(G.z + 1); };

/* ---------- input ---------- */
const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' };
const PM = { ShiftLeft: 'dash', ShiftRight: 'dash', KeyX: 'dash', KeyK: 'dash', KeyQ: 'strike', KeyL: 'strike', KeyE: 'echo' };
addEventListener('keydown', e => {
  if (G.mode === 'gate') { e.preventDefault(); gateGo(); return; }
  if (G.mode === 'intro') { if (G.introT > 15) toTitle(); return; }
  if (G.mode === 'play' || G.mode === 'dying' || G.mode === 'won' || G.mode === 'transit') {
    const k = KM[e.code];
    if (k) { e.preventDefault(); if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; }
    if (e.repeat) return;
    if (PM[e.code]) { e.preventDefault(); press[PM[e.code]] = 1; }
    if ((e.code === 'Escape' || e.code === 'KeyP') && G.mode === 'play') pause();
    if (e.code === 'KeyR' && G.mode === 'play') { G.S.dead = 1; G.S.why = 'restart'; stepPlay(); G.taunt = 'Restarting counts. Obviously.'; }
    if (e.code === 'KeyM') { SV.music = SV.music > 0 ? 0 : 0.6; AU.vol.music = SV.music; AU.applyVol(); save(); }
    return;
  }
  // menus
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
    if (document.activeElement && document.activeElement.type === 'range' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) return;
    e.preventDefault(); navMove(e.code === 'ArrowLeft' ? -1 : e.code === 'ArrowRight' ? 1 : 0, e.code === 'ArrowUp' ? -1 : e.code === 'ArrowDown' ? 1 : 0);
  } else if (e.code === 'Escape' || e.code === 'Backspace') {
    const back = { zones: 'title', levels: 'zones', chars: 'title', settings: 'title' }[G.screen];
    if (G.screen === 'pause') ACTIONS.resume(); else if (G.screen === 'chars' && G.shopSel) ACTIONS.shopclose(); else if (back) { SFX.click(); showScreen(back); }
  } else if (G.screen === 'complete' && e.code === 'KeyR') ACTIONS.retry();
});
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (G.mode === 'play') pause(); });
function navMove(dx, dy) {
  const scr = $('.screen.active'); if (!scr) return;
  const els = [...scr.querySelectorAll('.btn, .card, input[type=range]')];
  const cur = document.activeElement;
  if (!els.includes(cur)) { if (els[0]) els[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bd = 1e9;
  for (const el of els) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect(), ex = q.left + q.width / 2, ey = q.top + q.height / 2, ddx = ex - cx, ddy = ey - cy;
